apiVersion: apps/v1
kind: Deployment
metadata:
  name: im28-admin
  labels:
    app.kubernetes.io/name: im28-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: im28-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: im28-admin
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: im28-admin
          image: ghcr.io/unifun-im/im28-admin:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://im28-api-gateway:8080
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
